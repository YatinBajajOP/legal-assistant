name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint backend
        run: |
          # Example: pip install ruff black
          # ruff check backend/
          # black --check backend/
          echo "Backend linting placeholder"

      - name: Test backend
        run: |
          # Example: pytest backend/app/tests/
          echo "Backend testing placeholder"

  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: |
          # Example: npm run lint --prefix frontend
          echo "Frontend linting placeholder"

      - name: Test frontend
        run: |
          # Example: npm test --prefix frontend
          echo "Frontend testing placeholder"
